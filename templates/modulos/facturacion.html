<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Comprobante de Pedido | Grupo GSN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        
        /* ========== ESTILOS BASE ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body { 
    font-family: 'Inter', sans-serif; 
    padding: 0; 
    margin: 0; 
    color: #34d399;
    min-height: 100vh;
    min-height: 130dvh;
    overflow-y: auto !important;
    overflow-x: hidden;
    background: transparent !important;
    width: 100%;
    max-width: 100vw;
    background: rgba(0, 0, 0, 0.8);

}

/* ========== CONTENEDOR PRINCIPAL ========== */
.facturacion-modulo {
    padding-top: 12px;
    max-width: 1400px;
    margin: 0 auto;
    padding-left: 10px;
    padding-right: 10px;
    padding-bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeInUp 0.5s ease;
    min-height: calc(100vh - 52px);
    min-height: calc(100dvh - 52px);
    width: 100%;
}

        /* ========== TEMAS ========== */
        body.default-theme { background: transparent !important; }
        body.dark-theme { background: transparent !important; color: #34d399; }
        body.light-theme { background: transparent !important; color: #34d399; }
        body.light-theme .facturacion-header-sticky { background: rgba(10,26,10,0.05) !important; border-bottom-color: rgba(16,185,129,0.05); }
        body.light-theme .filtros-panel,
        body.light-theme .pedidos-panel,
        body.light-theme .factura-panel,
        body.light-theme .facturas-generadas-panel {
            background: rgba(10,26,10,0.05) !important;
            border-color: rgba(16,185,129,0.05);
        }
        body.light-theme .filtros-header,
        body.light-theme .pedidos-header,
        body.light-theme .factura-header-bar,
        body.light-theme .facturas-header {
            background: rgba(10,26,10,0.05);
            border-bottom-color: rgba(16,185,129,0.05);
        }
        body.light-theme .filtros-header h3,
        body.light-theme .pedidos-header h3,
        body.light-theme .factura-header-bar h3,
        body.light-theme .facturas-header h3 { color: #34d399; }
        body.light-theme .filtro-group label { color: #34d399; }
        body.light-theme .filtro-group select,
        body.light-theme .filtro-group input {
            background: rgba(10,26,10,0.05);
            border-color: rgba(16,185,129,0.08);
            color: #34d399;
        }
        body.light-theme .counter-badge {
            background: rgba(10,26,10,0.05);
            color: #10b981;
        }
        body.light-theme .pedido-card {
            background: rgba(10,26,10,0.05);
            border-color: rgba(16,185,129,0.05);
        }
        body.light-theme .pedido-card .pedido-empresa { color: #34d399; }
        body.light-theme .pedido-card .pedido-total { color: #10b981; }
        body.light-theme .pedido-card .info-adicional { color: #34d399; }
        body.light-theme .pedido-card:hover { background: rgba(10,26,10,0.1); }
        body.light-theme .btn-outline { border-color: rgba(16,185,129,0.08); color: #34d399; }
        body.light-theme .factura-container { background: rgba(10,26,10,0.05); }
        body.light-theme .factura-item { background: rgba(10,26,10,0.05); border-color: rgba(16,185,129,0.05); }
        body.light-theme .factura-item .factura-info h4 { color: #34d399; }
        body.light-theme .factura-item .factura-info p { color: #34d399; }
        body.light-theme .factura-item:hover { background: rgba(10,26,10,0.1); }
        body.light-theme .modal-config-content { background: rgba(10,26,10,0.05) !important; }
        body.light-theme .modal-config-header h3 { color: #34d399; }
        body.light-theme .modal-config-header { background: rgba(10,26,10,0.05); border-bottom-color: rgba(16,185,129,0.05); }
        body.light-theme .config-field label { color: #34d399; }
        body.light-theme .config-field input,
        body.light-theme .config-field textarea {
            background: rgba(10,26,10,0.05);
            border-color: rgba(16,185,129,0.08);
            color: #34d399;
        }
        body.light-theme .config-section h4 { color: #10b981; }
        body.light-theme .btn-add-field { color: #10b981; border-color: rgba(16,185,129,0.08); }
        body.light-theme .modal-config-footer { border-top-color: rgba(16,185,129,0.05); }
        body.light-theme .factura-preview { background: rgba(255,255,255,0.95); }

        body.navy-theme { background: transparent !important; color: #34d399; }
        body.nature-theme { background: transparent !important; color: #34d399; }
        body.image-theme { background: transparent !important; position: relative; }

        /* ========== BARRA FIJA ========== */
        .facturacion-header-sticky {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 26, 10, 0.05) !important;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 8px 12px;
            border-bottom: 1px solid rgba(16,185,129,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            height: 52px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .header-titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #34d399;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .header-titulo i {
            color: #10b981;
            font-size: 1rem;
        }
        .header-titulo span {
            background: linear-gradient(135deg, #34d399, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-titulo .badge-version {
            display: none;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-header {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.05);
            padding: 5px 10px;
            border-radius: 30px;
            color: #10b981;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(10px);
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .btn-header:hover { background: rgba(16, 185, 129, 0.1); }
        .btn-header span { display: none; }

        .btn-header-primary {
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.15));
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: #34d399;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .btn-header-primary:hover { transform: translateY(-1px); background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(5,150,105,0.25)); }
        .btn-header-primary span { display: none; }

        /* ========== CONTENEDOR PRINCIPAL ========== */
        .facturacion-modulo {
            padding-top: 12px;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUp 0.5s ease;
            min-height: 100vh;
        }
        
        .facturacion-layout {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        
        .col-izquierda {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .col-derecha {
            flex: 2;
            min-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .filtros-panel, .pedidos-panel, .factura-panel, .facturas-generadas-panel {
            background: rgba(10, 26, 10, 0.05) !important;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 16px;
            border: 1px solid rgba(16,185,129,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .filtros-header, .pedidos-header, .factura-header-bar, .facturas-header {
            padding: 8px 12px;
            background: rgba(16, 185, 129, 0.03);
            border-bottom: 1px solid rgba(16,185,129,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
        }
        
        .filtros-header h3, .pedidos-header h3, .factura-header-bar h3, .facturas-header h3 {
            font-size: 0.75rem;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
        }
        .filtros-header h3 i, .pedidos-header h3 i, .factura-header-bar h3 i, .facturas-header h3 i {
            color: #10b981;
            font-size: 0.75rem;
        }
        
        .filtros-body { padding: 8px 10px; flex-shrink: 0; }
        .filtros-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .filtro-group { flex: 1; min-width: 140px; }
        .filtro-group label { display: block; font-size: 0.6rem; color: #34d399; opacity: 0.6; margin-bottom: 2px; }
        .filtro-group select, .filtro-group input {
            width: 100%; padding: 6px 10px; background: rgba(10, 26, 10, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.05); border-radius: 8px; color: #34d399; font-size: 0.7rem;
            backdrop-filter: blur(10px);
        }
        .filtro-group select option { background: #0a1a0a; color: #34d399; }
        .filtro-group select { min-width: 120px; }
        .counter-badge { background: rgba(16, 185, 129, 0.05); padding: 2px 10px; border-radius: 20px; font-size: 0.6rem; font-weight: 600; color: #34d399; }
        
        .pedidos-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            padding: 8px;
            overflow-y: auto;
            flex: 1;
            max-height: 400px;
        }
        .pedidos-grid::-webkit-scrollbar { width: 4px; }
        .pedidos-grid::-webkit-scrollbar-track { background: rgba(16,185,129,0.02); border-radius: 10px; }
        .pedidos-grid::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.2); border-radius: 10px; }
        
        .pedido-card {
            background: rgba(10, 26, 10, 0.05) !important;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(16,185,129,0.05);
        }
        .pedido-card:hover { background: rgba(10, 26, 10, 0.1) !important; transform: translateX(2px); border-color: rgba(16,185,129,0.1); }
        .pedido-card.selected { border: 2px solid rgba(16,185,129,0.2); background: rgba(16, 185, 129, 0.05); }
        .pedido-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
        .pedido-empresa { font-weight: 700; font-size: 0.75rem; color: #34d399; }
        .estado-pendiente { background: rgba(16, 185, 129, 0.05); padding: 2px 8px; border-radius: 12px; font-size: 0.55rem; color: #34d399; }
        .pedido-total { font-size: 0.8rem; font-weight: 800; color: #10b981; text-align: right; margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(16,185,129,0.05); }
        .info-adicional { font-size: 0.55rem; color: #34d399; opacity: 0.6; margin-top: 4px; padding-top: 4px; border-top: 1px dashed rgba(16,185,129,0.05); display: flex; gap: 8px; flex-wrap: wrap; }
        .info-adicional span { display: inline-flex; align-items: center; gap: 3px; }
        
        .factura-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .factura-actions button { 
            width: 30px; 
            height: 30px; 
            padding: 0; 
            border-radius: 8px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.75rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            border: none; 
            backdrop-filter: blur(10px);
        }
        
        .btn-primary { background: rgba(16,185,129,0.1); color: #34d399; }
        .btn-success { background: rgba(16,185,129,0.1); color: #34d399; }
        .btn-success:hover { transform: translateY(-1px); background: rgba(16,185,129,0.15); }
        .btn-warning { background: rgba(139,92,246,0.1); color: #a78bfa; }
        .btn-warning:hover { transform: translateY(-1px); background: rgba(139,92,246,0.15); }
        .btn-info { background: rgba(16,185,129,0.1); color: #34d399; }
        .btn-outline { background: transparent; border: 1px solid rgba(16,185,129,0.05); color: #34d399; }
        .btn-danger { background: rgba(239,68,68,0.1); color: #f87171; border: none; }
        .btn-danger:hover { transform: translateY(-1px); background: rgba(239,68,68,0.15); }
        
        /* ===== FACTURA CONTAINER - SIN LÍMITE DE ALTURA ===== */
        .factura-container {
            padding: 12px;
            flex: 1;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            background: rgba(10, 26, 10, 0.05);
            max-height: none !important;
            height: auto !important;
            min-height: 500px;
        }
        .factura-container::-webkit-scrollbar { width: 6px; }
        .factura-container::-webkit-scrollbar-track { background: rgba(16,185,129,0.02); border-radius: 10px; }
        .factura-container::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.2); border-radius: 10px; }
        
        /* ===== FACTURA PREVIEW - COMPLETA Y VISIBLE ===== */
        .factura-preview {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: visible !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            margin: 0 auto;
            font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
            border: 1px solid rgba(200,200,200,0.3);
            height: auto !important;
            min-height: 300px;
        }
        .factura-content {
            background: #ffffff !important;
            padding: 20px 24px;
            color: #1a1a2e !important;
            overflow: visible !important;
            height: auto !important;
            min-height: 400px;
        }
        
        .factura-content [contenteditable="true"] {
            outline: none;
            border-bottom: 1px dashed rgba(0,0,0,0.15);
            min-width: 20px;
            display: inline-block;
            cursor: text;
            background: rgba(245,245,245,0.3);
            transition: all 0.2s;
            padding: 1px 4px;
            border-radius: 3px;
            color: #1a1a2e !important;
        }
        .factura-content [contenteditable="true"]:hover { background: rgba(245,245,245,0.6); }
        .factura-content [contenteditable="true"]:focus { border-bottom: 2px solid #f59e0b; background: rgba(245,245,245,0.5); outline: none; }
        
        .factura-content .factura-titulo { text-align: center; border-bottom: 2px solid #f59e0b; padding-bottom: 12px; margin-bottom: 18px; }
        .factura-content .factura-titulo h1 { font-size: 20px; font-weight: 800; color: #1a1a2e !important; margin-bottom: 4px; }
        .factura-content .factura-titulo p { color: #666 !important; font-size: 10px; margin: 2px 0; }
        .factura-content .factura-titulo h3 { font-size: 14px; margin-top: 8px; color: #333 !important; }
        
        .factura-content .info-row { display: flex; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
        .factura-content .info-box { flex: 1; background: #f8f9fa !important; padding: 10px 14px; border-radius: 8px; border-left: 3px solid #f59e0b; }
        .factura-content .info-box strong { display: block; font-size: 10px; color: #f59e0b !important; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .factura-content .info-box p { font-size: 11px; margin: 3px 0; color: #333 !important; line-height: 1.4; }
        
        .factura-content .info-flota {
            background: #f0f7ff !important;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            border: 1px solid #e0e8f0;
        }
        .factura-content .info-flota-item { flex: 1; min-width: 80px; }
        .factura-content .info-flota-item strong { font-size: 8px; color: #f59e0b !important; text-transform: uppercase; display: block; margin-bottom: 3px; letter-spacing: 0.3px; }
        .factura-content .info-flota-item p { font-size: 10px; color: #333 !important; margin: 2px 0; }
        
        /* ===== CAMPOS DE BONO, VIÁTICO Y TRASLADO - SOLO LECTURA ===== */
        .factura-content .info-extra-preview-item input.readonly-field {
            background: #f0f0f0 !important;
            border: 1px solid #ddd !important;
            color: #666 !important;
            cursor: default;
            opacity: 0.8;
            pointer-events: none;
        }
        .factura-content .info-extra-preview-item input.readonly-field:focus {
            outline: none;
            border-color: #ddd !important;
        }
        
        .factura-content .info-extra-preview {
            background: #fff8f0 !important;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            border: 1px solid #f0e8e0;
            border-left: 3px solid #f59e0b;
        }
        .factura-content .info-extra-preview-item { flex: 1; min-width: 80px; }
        .factura-content .info-extra-preview-item strong { font-size: 8px; color: #f59e0b !important; text-transform: uppercase; display: block; margin-bottom: 3px; }
        .factura-content .info-extra-preview-item input {
            width: 100%;
            padding: 4px 8px;
            background: #ffffff !important;
            border: 1px solid #ddd !important;
            border-radius: 6px;
            font-size: 10px;
            color: #333 !important;
        }
        .factura-content .info-extra-preview-item input:focus {
            outline: none;
            border-color: #f59e0b !important;
        }
        
        .factura-content .campos-preview { 
            margin: 12px 0; 
            padding: 10px; 
            background: #f5f5f5 !important; 
            border-radius: 8px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            border: 1px solid #eee;
        }
        .factura-content .campo-preview-item { 
            background: #ffffff !important;
            padding: 4px 12px; 
            border-radius: 16px; 
            font-size: 10px; 
            color: #333 !important; 
            border-left: 2px solid #f59e0b;
        }
        .factura-content .campo-preview-item strong { color: #f59e0b !important; margin-right: 4px; }
        .factura-content .campo-valor-editable { 
            display: inline-block; 
            min-width: 30px; 
            color: #333 !important;
        }
        
        .factura-content .factura-tabla {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
            display: table;
        }
        .factura-content .factura-tabla th {
            background: #f59e0b !important;
            color: #ffffff !important;
            padding: 10px 8px;
            text-align: center;
            font-weight: 700;
            font-size: 10px;
            border: 1px solid #e8a00a;
        }
        .factura-content .factura-tabla td {
            padding: 10px 8px;
            border: 1px solid #ddd;
            color: #333 !important;
            font-size: 10px;
        }
        .factura-content .factura-tabla td:first-child { text-align: left; background: #fefaf5 !important; }
        .factura-content .factura-tabla td { text-align: center; background: #ffffff !important; }
        .factura-content .factura-item-titulo { font-weight: 700; font-size: 11px; margin-bottom: 4px; display: block; color: #1a1a2e !important; }
        .factura-content .factura-item-subtitulo { font-size: 9px; color: #666 !important; margin-top: 2px; display: block; font-weight: normal; }
        
        .factura-content .btn-add-row {
            background: rgba(16,185,129,0.1);
            color: #10b981;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            margin: 8px 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .factura-content .btn-add-row:hover { transform: translateY(-1px); background: rgba(16,185,129,0.15); }
        .factura-content .btn-remove-row {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .factura-content .btn-remove-row:hover { background: rgba(239,68,68,0.2); }
        
        .factura-content .factura-totales {
            text-align: right;
            margin-top: 18px;
            padding-top: 12px;
            border-top: 2px solid #f59e0b;
            background: #fefaf5 !important;
            padding: 12px 18px;
            border-radius: 6px;
        }
        .factura-content .factura-totales .total-label {
            font-size: 13px;
            font-weight: 700;
            color: #1a1a2e !important;
        }
        .factura-content .factura-totales .total-monto {
            font-size: 18px;
            font-weight: 800;
            color: #f59e0b !important;
            margin-left: 12px;
            display: inline-block;
            background: #fff !important;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #f0e0d0;
        }
        
        .factura-content .factura-footer {
            text-align: center;
            margin-top: 18px;

<script>
(function() {
    console.log("🧾 Comprobante de Pedido - Móvil + Campos solo lectura");

    // ==================== TEMAS ====================
    function obtenerUsuarioKey() {
        try {
            var usuarioStr = localStorage.getItem('usuario_actual') || localStorage.getItem('usuario');
            if (usuarioStr) {
                var usuario = JSON.parse(usuarioStr);
                return 'tema_usuario_' + (usuario.id || usuario.email || 'default');
            }
        } catch(e) {}
        return 'tema_usuario_default';
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? parseInt(result[1], 16) + ', ' + parseInt(result[2], 16) + ', ' + parseInt(result[3], 16) : '10, 26, 10';
    }

    function aplicarTransparenciaModulo(t) {
        var defaultTransparencia = { fondo: 0.05, tarjetas: 0.05, bordes: 0.05, blur: 30 };
        if (!t) {
            var usuarioKey = obtenerUsuarioKey();
            var transparenciaGuardada = localStorage.getItem(usuarioKey + '_transparencia');
            if (transparenciaGuardada) {
                try { t = JSON.parse(transparenciaGuardada); } catch(e) { t = defaultTransparencia; }
            } else { t = defaultTransparencia; }
        }
        var fondo = t.fondo || defaultTransparencia.fondo;
        var tarjetas = t.tarjetas || defaultTransparencia.tarjetas;
        var bordes = t.bordes || defaultTransparencia.bordes;
        var blur = t.blur || defaultTransparencia.blur;

        var cards = document.querySelectorAll('.filtros-panel, .pedidos-panel, .factura-panel, .facturas-generadas-panel, .pedido-card, .factura-item, .modal-config-content');
        cards.forEach(function(el) {
            if (el.classList.contains('factura-preview') || el.closest('.factura-preview')) return;
            el.style.backgroundColor = 'rgba(10, 26, 10, ' + tarjetas + ') !important';
            el.style.backdropFilter = 'blur(' + blur + 'px)';
            el.style.webkitBackdropFilter = 'blur(' + blur + 'px)';
            el.style.borderColor = 'rgba(16,185,129, 0.05)';
        });

        var headers = document.querySelectorAll('.filtros-header, .pedidos-header, .factura-header-bar, .facturas-header, .facturacion-header-sticky');
        headers.forEach(function(el) {
            el.style.background = 'rgba(10, 26, 10, ' + fondo + ') !important';
            el.style.backdropFilter = 'blur(' + blur + 'px)';
            el.style.webkitBackdropFilter = 'blur(' + blur + 'px)';
            el.style.borderBottomColor = 'rgba(16,185,129, 0.05)';
        });

        var modal = document.querySelector('.modal-config-content');
        if (modal) {
            modal.style.background = 'rgba(10, 26, 10, ' + fondo + ') !important';
            modal.style.backdropFilter = 'blur(' + blur + 'px)';
            modal.style.webkitBackdropFilter = 'blur(' + blur + 'px)';
            modal.style.borderColor = 'rgba(16,185,129, 0.05)';
        }

        var buttons = document.querySelectorAll('.btn-primary, .btn-success, .btn-warning, .btn-info, .btn-danger, .btn-header, .btn-header-primary');
        buttons.forEach(function(el) {
            el.style.backdropFilter = 'blur(' + blur + 'px)';
            el.style.webkitBackdropFilter = 'blur(' + blur + 'px)';
        });

        var usuarioKey = obtenerUsuarioKey();
        localStorage.setItem(usuarioKey + '_transparencia', JSON.stringify({ fondo, tarjetas, bordes, blur }));
    }

    function cargarTransparenciaGuardada() {
        var usuarioKey = obtenerUsuarioKey();
        var transparenciaGuardada = localStorage.getItem(usuarioKey + '_transparencia');
        if (transparenciaGuardada) {
            try { var t = JSON.parse(transparenciaGuardada); aplicarTransparenciaModulo(t); return t; } catch(e) {}
        }
        aplicarTransparenciaModulo(null);
        return null;
    }

    function aplicarTema(tema, imagenUrl) {
        var body = document.body;
        body.classList.remove('default-theme', 'dark-theme', 'light-theme', 'navy-theme', 'nature-theme', 'image-theme');

    function cargarTemaGuardado() {
        var usuarioKey = obtenerUsuarioKey();
        var temaGuardado = localStorage.getItem(usuarioKey);
        var imagenGuardada = localStorage.getItem(usuarioKey + '_imagen');
        if (temaGuardado) {
            if (temaGuardado === 'image' && imagenGuardada) aplicarTema('image', imagenGuardada);
            else if (temaGuardado !== 'image') aplicarTema(temaGuardado);
        }
        cargarTransparenciaGuardada();
    }

    function escucharMensajesTema() {
        window.addEventListener('message', function(event) {
            var msg = event.data;
            if (!msg) return;
            if (msg.type === 'CAMBIAR_TEMA') {
                var tema = msg.tema, imagen = msg.imagen || null;
                if (tema) {
                    if (tema === 'image' && imagen) aplicarTema('image', imagen);
                    else if (tema !== 'image') aplicarTema(tema);
                }
            }
            if (msg.type === 'APLICAR_TRANSPARENCIA') {
                var transparencia = msg.transparencia;
                if (transparencia) aplicarTransparenciaModulo(transparencia);
            }
        });
    }

    async function cargarConfigBackend() {

            var response = await fetch('/api/obtener_config_factura');
            var data = await response.json();
            if (data.ok && data.config) {
                configFactura = { ...configFactura, ...data.config };
                if (data.config.empresa) configFactura.empresa = { ...configFactura.empresa, ...data.config.empresa };
                if (data.config.colores) configFactura.colores = { ...configFactura.colores, ...data.config.colores };
                if (data.config.visibles) configFactura.visibles = { ...configFactura.visibles, ...data.config.visibles };
                if (data.config.camposAdicionales) configFactura.camposAdicionales = data.config.camposAdicionales;
            }
            return true;
        } catch(e) { return true; }
    }

    async function cargarPedidosParaFacturar() {
        if (isLoading) return;
        isLoading = true;
        
        try {
            var empresaId = document.getElementById('selectEmpresaFacturar')?.value;
            var todosPedidos = await obtenerPedidosParaFacturar();
            
            var filtrados = [].concat(todosPedidos);
            if (empresaId && empresaId !== '') {
                filtrados = filtrados.filter(function(p) { return p.empresa_id === empresaId; });
            }
            filtrados.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });
            pedidosParaFacturar = filtrados;
            
            document.getElementById('pedidosCount').innerText = pedidosParaFacturar.length;
            var container = document.getElementById('pedidosList');
            
            if (pedidosParaFacturar.length === 0) { 
                container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No hay pedidos pendientes</p></div>'; 
                return; 
            }
            
            container.innerHTML = pedidosParaFacturar.map(function(p) {
                var total = (p.galones || 0) * (p.precio_por_galon || 0) + (p.costo_traslado || 0);
                return '<div class="pedido-card" data-id="' + p.id + '" onclick="window.seleccionarPedido(\'' + p.id + '\')">' +
                    '<div class="pedido-card-header"><span class="pedido-empresa">' + escapeHtml(p.nombre || p.empresa_nombre || 'Cliente') + '</span><span class="estado-pendiente">PENDIENTE</span></div>' +
                    '<div class="pedido-total">' + formatearMoneda(total) + '</div>' +
                    '<div class="info-adicional"><span><i class="fas fa-user-tie"></i> ' + escapeHtml(p.conductor_asignado || '-') + '</span><span><i class="fas fa-truck"></i> ' + escapeHtml(p.camion_asignado || '-') + '</span></div>' +
                '</div>';
            }).join('');
            
            if (modoEdicion === 'factura') limpiarSeleccionFactura();
            
            if (pedidoSeleccionado && modoEdicion === 'pedido') {
                var pedidoAunExiste = pedidosParaFacturar.find(function(p) { return p.id === pedidoSeleccionado.id; });
                if (pedidoAunExiste) {
                    document.querySelector('.pedido-card[data-id="' + pedidoSeleccionado.id + '"]')?.classList.add('selected');
                    // Actualizar comprobante con los datos del pedido seleccionado
                    if (pedidoSeleccionado) {
                        actualizarComprobanteConPedido(pedidoSeleccionado);
                    }
                } else {
                    pedidoSeleccionado = null;
                    mostrarComprobantePorDefecto();
                }
            }

            bono1: pedido.bono1 || '',

            viatico1: pedido.viatico1 || 0,

                { descripcion: pedido.tipo_combustible || 'Combustible', cantidad: galonesInicial, precio: precioInicial, total: galonesInicial * precioInicial }
            ],
            total: totalInicial

    function recalcularTotalTabla() {
        var totalGeneral = 0;
        var filas = document.querySelectorAll('#tabla-items tbody tr');
        filas.forEach(function(fila, index) {
            var cantidadInput = fila.querySelector('.cantidad-item');
            var precioInput = fila.querySelector('.precio-item');
            var totalSpan = fila.querySelector('.item-total');
            
            var cantidad = 0, precio = 0;
            if (cantidadInput) {
                var cantText = cantidadInput.innerText.trim();
                cantidad = parseFloat(cantText.replace(/[^0-9.-]/g, '')) || 0;
            }
            if (precioInput) {
                var precText = precioInput.innerText.trim();
                precio = parseFloat(precText.replace(/[^0-9.-]/g, '')) || 0;
            }
            
            var totalFila = cantidad * precio;
            if (totalSpan) totalSpan.innerText = formatearMoneda(totalFila);
            totalGeneral += totalFila;
            if (filasTabla[index]) {
                filasTabla[index].cantidad = cantidad;
                filasTabla[index].precio = precio;
                filasTabla[index].total = totalFila;
            }
        });
        
        var costoTrasladoInput = document.querySelector('#costoTrasladoPreview');
        if (costoTrasladoInput) {
            var costoTraslado = parseFloat(costoTrasladoInput.value) || 0;
            totalGeneral += costoTraslado;
        }
        
        var totalElement = document.getElementById('totalMonto');
        if (totalElement) totalElement.innerText = formatearMoneda(totalGeneral);
        return totalGeneral;
    }
    
    function agregarFilaTabla(descripcion, cantidad, precio) {
        descripcion = descripcion || '';
        cantidad = cantidad || 0;

        var tbody = document.querySelector('#tabla-items tbody');

            '</td>' +

            '<td><span contenteditable="true" class="precio-item" data-field="precio_' + rowId + '">' + formatearMoneda(precio) + '</span></td>' +
            '<td><span class="item-total" data-field="total_' + rowId + '">' + formatearMoneda(cantidad * precio) + '</span>' +
                '<button class="btn-remove-row" onclick="this.closest(\'tr\').remove(); window.recalcularTotalTabla();" style="margin-left:6px;">✖</button>' +
            '</td>';

        var viatico2Input = document.getElementById('viatico2Preview');

        var costoTrasladoInput = document.getElementById('costoTrasladoPreview');
        if (costoTrasladoInput) datos.costo_traslado = parseFloat(costoTrasladoInput.value) || 0;
        
        var filas = document.querySelectorAll('#tabla-items tbody tr');
        datos.filas = [];
        filas.forEach(function(fila, idx) {
            var descripcionEl = fila.querySelector('.factura-item-titulo');
            var cantidadEl = fila.querySelector('.cantidad-item');
            var precioEl = fila.querySelector('.precio-item');
            var descripcion = descripcionEl ? descripcionEl.innerText.trim() : 'Producto';
            var cantidad = 0, precio = 0;
            if (cantidadEl) cantidad = parseFloat(cantidadEl.innerText.trim().replace(/[^0-9.-]/g, '')) || 0;
            if (precioEl) precio = parseFloat(precioEl.innerText.trim().replace(/[^0-9.-]/g, '')) || 0;
            datos.filas.push({ descripcion: descripcion, cantidad: cantidad, precio: precio, total: cantidad * precio });
            if (idx === 0) { datos.tipo_combustible = descripcion; datos.galones = cantidad; datos.precio_galon = precio; }
        });
        
        document.querySelectorAll('.campo-valor-editable').forEach(function(el) {
            var nombreCampo = el.dataset.campo;
            var valor = el.innerText.trim();
            datos.campos_adicionales[nombreCampo] = valor;
        });
        
        var totalEl = document.getElementById('totalMonto');
        if (totalEl) {
            var totalText = totalEl.innerText.trim();
            var totalMatch = totalText.match(/[\d,.]+/);
            if (totalMatch) datos.total = parseFloat(totalMatch[0].replace(/,/g, ''));
        }
        return datos;
    }

    async function actualizarFactura() {
        if (!facturaSeleccionada) { mostrarToast('No hay comprobante seleccionado', 'warning'); return; }
        var btn = document.getElementById('accionFacturaBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
        try {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'CERRAR_MODAL_FACTURA', factura_id: facturaSeleccionada.id }, '*');
            }
            await new Promise(function(resolve) { setTimeout(resolve, 300); });
            var datosEditados = capturarValoresEditados();
            var totalFinal = 0;
            datosEditados.filas.forEach(function(fila) { totalFinal += fila.total; });
            totalFinal += datosEditados.costo_traslado;
            
            var response = await fetch('/api/actualizar_factura', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    factura_id: facturaSeleccionada.id,
                    datos: {
                        empresa_nombre: datosEditados.cliente_nombre || facturaSeleccionada.empresa_nombre,
                        empresa_nit: datosEditados.cliente_nit || facturaSeleccionada.empresa_nit,
                        galones: datosEditados.galones || 0,
                        precio_por_galon: datosEditados.precio_galon || 0,
                        costo_traslado: datosEditados.costo_traslado || 0,
                        total: totalFinal,
                        bono1: datosEditados.bono1 || '',
                        bono2: datosEditados.bono2 || '',
                        viatico1: datosEditados.viatico1 || 0,
                        viatico2: datosEditados.viatico2 || 0,
                        filas: datosEditados.filas,
                        campos_adicionales: datosEditados.campos_adicionales
                    }
                })
            });
            var data = await response.json();
            if (data.ok) {
                mostrarToast('✅ Comprobante actualizado', 'success');
                mostrarComprobantePorDefecto();
                await cargarFacturasGeneradas();
                await cargarPedidosParaFacturar();
            } else {
                mostrarToast(data.error || 'Error', 'error');
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i>'; btn.className = 'btn-warning';
            }
        } catch(error) {
            console.error("Error:", error);
            mostrarToast('Error de conexión', 'error');
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i>'; btn.className = 'btn-warning';
        } finally {
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i>';
        }
    }

    // ==================== CARGAR FACTURAS GENERADAS (CORREGIDO) ====================
 // ==================== CARGAR FACTURAS GENERADAS (MUESTRA TODAS) ====================
async function cargarFacturasGeneradas() {
    try {
        var response = await fetch('/api/facturas_lista');
        var data = await response.json();
        var facturas = data.facturas || [];
        var container = document.getElementById('facturasList');
        
        // Obtener permisos para mostrar el estado del checkbox
        var permisos = {};
        try {
            var permResponse = await fetch('/api/obtener_permisos_facturas');
            var permData = await permResponse.json();
            if (permData.ok && permData.permisos) {
                permisos = permData.permisos;
            }
        } catch(e) {
            console.warn("Error obteniendo permisos:", e);
        }
        
        console.log("[DEBUG] Facturas totales:", facturas.length);
        
        // ============ MOSTRAR TODAS LAS FACTURAS (SIN FILTRAR) ============
        facturas.sort(function(a, b) { 
            return new Date(b.fecha_emision) - new Date(a.fecha_emision); 
        });
        facturasListaGlobal = facturas;
        
        if (facturas.length === 0) { 
            container.innerHTML = '<div class="empty-state"><i class="fas fa-receipt"></i><p>No hay comprobantes</p></div>'; 
            return; 
        }
        
        container.innerHTML = facturas.slice(0, 50).map(function(f) {
            var permitido = permisos[f.id] === true;
            return '<div class="factura-item" data-id="' + f.id + '" onclick="window.seleccionarFactura(\'' + f.id + '\')">' +
                '<div class="factura-info"><h4>' + escapeHtml(f.id) + '</h4><p>' + escapeHtml(f.empresa_nombre || 'Cliente') + ' | ' + formatearMoneda(f.total) + '</p></div>' +
                '<div style="display:flex; gap:4px; align-items:center;" onclick="event.stopPropagation()">' +
                    '<label class="factura-checkbox ' + (permitido ? 'checked' : '') + '" style="display:flex; align-items:center; gap:3px; cursor:pointer;">' +
                        '<input type="checkbox" class="factura-permiso" data-id="' + f.id + '" ' + (permitido ? 'checked' : '') + ' style="width:14px; height:14px; cursor:pointer; accent-color:#f59e0b;">' +
                        '<span style="font-size:7px;color:#666;">Compartir</span>' +
                    '</label>' +
                    '<button class="btn-primary" onclick="window.descargarFacturaPorId(\'' + f.id + '\')" style="width:24px; height:24px; border-radius:6px; font-size:8px; background:rgba(16,185,129,0.1); color:#34d399; border:none; cursor:pointer;"><i class="fas fa-download"></i></button>' +
                '</div>' +
            '</div>';
        }).join('');
        
        // Event listeners para los checkboxes
        document.querySelectorAll('.factura-permiso').forEach(function(checkbox) {
            checkbox.addEventListener('change', async function(e) {
                e.stopPropagation();
                var facturaId = this.dataset.id;
                var permitido = this.checked;
                
                console.log("[DEBUG] Cambiando permiso:", facturaId, permitido);
                
                // Actualizar permiso en el servidor
                await actualizarPermisoFactura(facturaId, permitido);
                
                // Actualizar UI del checkbox
                var parent = this.closest('.factura-checkbox');
                if (parent) { 
                    if (permitido) parent.classList.add('checked'); 
                    else parent.classList.remove('checked'); 
                }
                
                // Recargar la lista para reflejar el cambio
                await cargarFacturasGeneradas();
                
                // Mostrar mensaje
                if (permitido) {
                    mostrarToast('🔓 Comprobante compartido', 'success');
                } else {
                    mostrarToast('🔒 Comprobante oculto', 'info');
                }
            });
        });
    } catch(error) {
        console.error("Error en cargarFacturasGeneradas:", error);
        document.getElementById('facturasList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error cargando comprobantes</p></div>';
    }
}
    function limpiarSeleccionFactura() {
        facturaSeleccionada = null;
        modoEdicion = 'pedido';
        filasTabla = [];
        datosEditadosCache = {};
        camposAdicionalesValores = {};
        var btn = document.getElementById('accionFacturaBtn');
        btn.className = 'btn-success'; btn.innerHTML = '<i class="fas fa-save"></i>'; btn.title = 'Guardar (Nuevo Comprobante)';
    }
    
    function descargarFacturaPorId(id) { window.open('/descargar_factura/' + id, '_blank'); }

    async function enviarFacturaPorCorreo() {
        if (!facturaGenerada && !facturaSeleccionada) { mostrarToast('No hay comprobante', 'warning'); return; }
        var facturaId = facturaGenerada ? facturaGenerada.factura_id : facturaSeleccionada.id;
        var emailCliente = prompt('📧 Correo del cliente:', 'cliente@ejemplo.com');
        if (!emailCliente) return;
        var btn = document.getElementById('enviarCorreoBtn'); btn.disabled = true;
        try {
            var response = await fetch('/api/enviar_factura_correo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ factura_id: facturaId, email: emailCliente }) });
            var data = await response.json();
            if (data.ok) mostrarToast('📧 Enviada', 'success');
            else mostrarToast('Error', 'error');
        } catch(e) { mostrarToast('Error de conexión', 'error'); }
        finally { btn.disabled = false; }
    }

    function imprimirFactura() {
        var contenido = document.getElementById('facturaPreview')?.innerHTML;
        if (!contenido || contenido.includes('Seleccione')) { mostrarToast('No hay comprobante', 'warning'); return; }
        var ventana = window.open('', '_blank');
        ventana.document.write('<!DOCTYPE html><html><head><title>Comprobante GSN</title><meta charset="UTF-8"><style>' + document.querySelector('style').innerHTML + '</style></head><body style="background:#f5f5f5; padding:20px;">' + contenido + '<script>setTimeout(function(){ window.print(); window.close(); }, 500);<\/script></body></html>');
        ventana.document.close();
    }

    async function descargarFacturaPDF() { 
        var facturaId = facturaGenerada ? facturaGenerada.factura_id : (facturaSeleccionada ? facturaSeleccionada.id : null);
        if (!facturaId) { mostrarToast('No hay comprobante', 'warning'); return; } 
        window.open('/descargar_factura/' + facturaId, '_blank'); 
    }

    window.debugPedidosFacturacion = async function() { 
        mostrarToast('Recargando...', 'info');
        await cargarPedidosParaFacturar(); 
        mostrarToast('Pedidos recargados', 'success'); 
    };

    async function limpiarFacturas() {
        if (!confirm('¿Limpiar listado de comprobantes?')) return;
        try {
            var response = await fetch('/api/limpiar_facturas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmar: true }) });
            var data = await response.json();
            if (data.ok) {
                mostrarToast('✅ ' + (data.mensaje || 'Comprobantes limpiados'), 'success');
                await cargarFacturasGeneradas();
            }
        } catch(e) { mostrarToast('Error', 'error'); }
    }

    window.addEventListener('message', async function(event) {
        if (event.data && event.data.type === 'PEDIDO_ENVIADO_FACTURACION') {
            mostrarToast('🔄 Nuevo pedido', 'info');
            await cargarPedidosParaFacturar();
        }
        if (event.data && event.data.type === 'APLICAR_TRANSPARENCIA') {
            var transparencia = event.data.transparencia;
            if (transparencia) aplicarTransparenciaModulo(transparencia);
        }
    });

    // Event listener para el botón de filtrar
    document.getElementById('filtrarBtn')?.addEventListener('click', function() {
        cargarPedidosParaFacturar();
        mostrarToast('🔄 Filtrado...', 'info');
    });

    async function init() {
        console.log("🚀 Comprobante de Pedido - Móvil + Campos solo lectura");
        cargarTemaGuardado();
        escucharMensajesTema();
        await cargarConfigBackend();
        aplicarConfigAInputs();
        await cargarEmpresasSelect();
        
        // ===== MOSTRAR COMPROBANTE POR DEFECTO =====
        mostrarComprobantePorDefecto();
        
        await cargarPedidosParaFacturar();
        await cargarFacturasGeneradas();
        
        document.getElementById('cargarPedidosBtn').onclick = function() { cargarPedidosParaFacturar(); };
        document.getElementById('refrescarPedidosBtn').onclick = function() { cargarPedidosParaFacturar(); };
        document.getElementById('refrescarFacturasBtn').onclick = function() { cargarFacturasGeneradas(); };
        document.getElementById('accionFacturaBtn').onclick = function() {
            if (modoEdicion === 'factura' && facturaSeleccionada) actualizarFactura();
            else generarNuevaFactura();
        };
        document.getElementById('enviarCorreoBtn').onclick = enviarFacturaPorCorreo;
        document.getElementById('imprimirFacturaBtn').onclick = imprimirFactura;
        document.getElementById('descargarPDFBtn').onclick = descargarFacturaPDF;
        document.getElementById('configFacturaBtn').onclick = function() { abrirModalConfig(); };
        document.getElementById('limpiarFacturasBtn').onclick = limpiarFacturas;
        
        setTimeout(cargarTransparenciaGuardada, 500);
        setInterval(async function() { await cargarPedidosParaFacturar(); await cargarFacturasGeneradas(); }, 30000);
        console.log("✅ Comprobante de Pedido inicializado");
    }
    
    window.descargarFacturaPorId = descargarFacturaPorId;
    window.guardarConfigFactura = guardarConfigFactura;
    window.cerrarModalConfig = cerrarModalConfig;
    window.agregarCampoAdicional = agregarCampoAdicional;
    window.actualizarCampoAdicional = actualizarCampoAdicional;
    window.eliminarCampoAdicional = eliminarCampoAdicional;
    window.seleccionarPedido = window.seleccionarPedido;
    window.seleccionarFactura = window.seleccionarFactura;
    window.debugPedidosFacturacion = debugPedidosFacturacion;
    window.aplicarTransparenciaModulo = aplicarTransparenciaModulo;
    
    init();
})();
</script>
</body>
</html>
